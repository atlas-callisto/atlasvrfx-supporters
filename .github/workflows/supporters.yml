name: Sync Patreon supporters
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: supporters
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch supporters
        env:
          PATREON_TOKEN: ${{ secrets.PATREON_TOKEN }}
          PATREON_CAMPAIGN_ID: ${{ secrets.PATREON_CAMPAIGN_ID }}
          VERIFY_URL: ${{ secrets.VERIFY_URL }}
          VERIFY_SECRET: ${{ secrets.VERIFY_SECRET }}
        run: python3 sync_supporters.py
      - name: Publish if changed
        run: |
          git diff --quiet -- docs/supporters.txt && exit 0
          git config user.name supporters-bot
          git config user.email supporters-bot@users.noreply.github.com
          git add docs/supporters.txt
          git commit -m "Update supporters"
          git push
